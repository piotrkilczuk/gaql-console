[tool.poetry]
name = "gaql-console"
version = "0.5.0"
description = "Google Ads Query Language Interactive Console"
authors = ["Piotr Kilczuk <piotr@kilczuk.dev>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
prompt-toolkit = "^3.0.47"
Pygments = "^2.11.2"
# Lower bound: google-ads 30.1.0 is the first release with Google Ads API v24.
# google-ads drops old API versions in major releases (33.0.0 dropped v22),
# so check its ChangeLog before relying on newer google-ads.
google-ads = {version = ">=30.1.0", python = ">=3.9,<3.15"}
click = "^8.1.7"
toml = "^0.10.2"

[tool.poetry.dev-dependencies]
pytest = "^8.3.2"
black = "^24.8.0"

[tool.poetry.scripts]
gaql = "gaql_console.console:main"

[tool.black]
line-length = 119

[tool.gaql-console]
context-callable = "dummy_context_callable:provide_context"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
